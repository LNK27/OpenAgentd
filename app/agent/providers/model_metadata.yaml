# Model metadata registry.
#
# Centralized per-model operational metadata. Keep modality flags in
# capabilities.yaml; this file is for limits and future non-modality metadata
# such as supported parameters or reasoning budgets.
#
# Values are exact-match by OpenAgentd provider:model ID. Unknown models return
# null limits, not guessed values. Initial limits were cross-checked against
# LiteLLM model_prices_and_context_window.json on 2026-05-21.
#
# limits.context_length: provider reported max input/context tokens.
# limits.max_completion_tokens: provider/model maximum generated tokens.
# thinking.levels: supported reasoning controls for agent frontmatter
# (`thinking_level`). Omitted means unknown or unsupported.

