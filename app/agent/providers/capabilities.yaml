# Model capabilities registry.
#
# Only list models with non-default capabilities (vision input, audio
# in/out, video in, image/audio/video output, etc.). Anything not
# listed is treated as text-in / text-out. Sparse merge — write only
# the fields that differ from defaults.
#
# Loaded from inside the wheel, so users get fresh capabilities on every
# CLI or desktop upgrade. To verify upstream model IDs before adding
# entries, run: `uv run python -m manual.provider_models <provider...>`
# (requires the daemon + credentials). Long-term direction: see
# documents/techdebts/model-capabilities-registry.md.

# ── OpenAI ──────────────────────────────────────────────────────────────────
# Image / video / audio specialised models. Override text-out to false
# because they don't emit text responses.
"openai:gpt-image-2":
  input: { vision: true }
  output: { text: false, image: true }
"openai:gpt-4o-mini-tts":
  output: { text: false, audio: true }
"openai:gpt-4o-transcribe":
  input: { audio: true }
"openai:gpt-4o-mini-transcribe":
  input: { audio: true }
"openai:gpt-realtime-2":
  input: { audio: true }
  output: { audio: true }
"openai:gpt-realtime-1.5":
  input: { audio: true }
  output: { audio: true }
"openai:gpt-realtime-mini":
  input: { audio: true }
  output: { audio: true }
