[package]
name = "openagentd-mobile"
version = "1.34.0"
description = "OpenAgentd mobile shell"
authors = ["openagentd contributors"]
license = "Apache-2.0"
repository = "https://github.com/lthoangg/openagentd"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
url = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
