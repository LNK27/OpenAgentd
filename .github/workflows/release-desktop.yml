name: Release Desktop

# Triggered manually from the Actions tab once a version is tagged.
# Produces signed (where keys are available) installers for:
#   - macOS arm64 (.dmg, .app.tar.gz)
#   - Windows x64 (.exe NSIS installer, .msi)
#   - Linux x64  (.AppImage, .deb)
#
# Outputs are attached to the GitHub Release matching `app/version.txt`.
# The `latest.json` updater manifest is generated last and uploaded to
# the same release; the Tauri updater endpoint
# (configured in tauri.conf.json) points at that file.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'release-desktop' to confirm"
        required: true
      channel:
        description: "Release channel"
        type: choice
        options: [stable, beta, nightly]
        default: stable

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'release-desktop'
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          VERSION=$(cat app/version.txt | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-desktop" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    name: Build (${{ matrix.platform }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            arch: aarch64
            # macos-15 (Sequoia) is GA, Apple-Silicon-native, and
            # linked-against-a-newer-SDK enough that the traffic-light
            # offset renders correctly on macOS 26 (Tahoe) too. macos-14
            # binaries had a ~6 pt offset drift on Tahoe; see
            # documents/techdebts/distribution-coverage.md.
            runner: macos-15
            rust_target: aarch64-apple-darwin
            tauri_args: "--target aarch64-apple-darwin --verbose"
          - platform: windows
            arch: x86_64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            tauri_args: "--verbose"
          - platform: linux
            arch: x86_64
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            # Skip the AppImage bundle on CI for now: linuxdeploy reliably
            # fails on GitHub-hosted Ubuntu 22.04 runners and Tauri swallows
            # the underlying error so we can't actually diagnose it from CI
            # output. The .deb covers Debian/Ubuntu users; tracking AppImage
            # restoration in documents/techdebts/distribution-coverage.md.
            tauri_args: "--bundles deb --verbose"

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux WebKitGTK + AppImage deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libfuse2

      # ``linuxdeploy`` and the AppImage runtime use a FUSE-mounted
      # squashfs by default. GitHub-hosted ubuntu-22.04 runners don't
      # allow FUSE mounts inside the action environment, so we tell the
      # AppImage tools to extract-and-run instead. Without this the
      # bundle step dies with a bare 'failed to run linuxdeploy' and
      # Tauri swallows the actual error message.
      - name: Configure AppImage extract-and-run mode
        if: matrix.platform == 'linux'
        run: echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      # ``Swatinem/rust-cache`` cleans the target/ tree (drops examples,
      # tests, incremental artifacts) before saving, so the cached blob
      # stays small (~200 MB instead of >1 GB). It also keys on
      # ``rustc -Vv``, ``Cargo.lock``, and target triple so a Rust
      # toolchain bump or dependency change invalidates correctly.
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: ${{ matrix.platform }}-${{ matrix.arch }}
          # Save on every run including PR re-pushes — without this,
          # only the default branch warms the cache.
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}

      # ``tauri-cli`` would otherwise compile from source for ~3 minutes
      # per platform per release. ``cargo-binstall`` fetches a prebuilt
      # binary from the tauri-apps release page in a few seconds.
      - name: Install cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Install tauri-cli (prebuilt)
        run: cargo binstall --no-confirm --version "^2.0" tauri-cli

      - name: Generate platform icons
        working-directory: desktop/src-tauri
        run: cargo tauri icon icons/icon.png

      # Tauri's ``beforeBuildCommand`` (declared in tauri.conf.json)
      # already runs ``bun install --frozen-lockfile && bun run build``
      # and copies web/dist → app/_web_dist/. We invoke it once
      # explicitly here so the Python sidecar build below can pick up
      # app/_web_dist/ before cargo tauri build runs (which would
      # otherwise run beforeBuildCommand a second time, mid-Rust-build).
      #
      # ``shell: bash`` is required on Windows: GitHub's default shell
      # there is PowerShell, which can't parse '\' line continuations
      # and would die with 'Missing expression after unary operator'.
      - name: Build web UI
        shell: bash
        run: |
          cd web
          bun install --frozen-lockfile
          bun run build
          mkdir -p ../app/_web_dist
          cp -r dist/* ../app/_web_dist/

      - name: Build Python sidecar bundle
        shell: bash
        run: |
          # The smoke test spawns the sidecar and waits for its
          # handshake on stdout. On Windows GitHub-hosted runners it
          # has been hanging past 30+ minutes — likely a stdout pipe
          # buffering issue rather than a real failure mode. Disable
          # the smoke test on Windows; macOS + Linux still run it and
          # exercise the same bundle layout. Track restoration in
          # documents/techdebts/distribution-coverage.md.
          smoke_flag=""
          if [ "${{ matrix.platform }}" = "windows" ]; then
            smoke_flag="--no-smoke"
          fi
          python3 scripts/build_sidecar.py \
            --root . \
            --out desktop/sidecar-bundle \
            --python-version 3.14 \
            $smoke_flag

      - name: Import Apple signing certificate
        if: matrix.platform == 'macos' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      # Tauri's signing env vars must be UNSET when there is no Apple
      # signing identity available — passing an empty
      # ``APPLE_SIGNING_IDENTITY`` makes Tauri try to find an identity
      # matching the empty string and fail with 'The specified item
      # could not be found in the keychain.'
      #
      # We expose the variables conditionally via a separate ``Set env``
      # step that writes only the entries whose secrets are non-empty;
      # ``cargo tauri build`` then sees an empty environment and falls
      # back to the ad-hoc ``signingIdentity: "-"`` from tauri.conf.json.
      - name: Resolve signing env
        id: signing_env
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Write each non-empty secret to $GITHUB_ENV so it's available
          # in the next step. Empty secrets are skipped entirely, so
          # ``cargo tauri build`` doesn't see a stray empty string and
          # try to match it against the keychain.
          for var in APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
                     TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            value="${!var:-}"
            if [ -n "$value" ]; then
              # Use the heredoc multiline form so values with newlines
              # (PEM-formatted minisign key) round-trip correctly.
              {
                echo "${var}<<__OAD_EOF__"
                printf '%s\n' "$value"
                echo "__OAD_EOF__"
              } >> "$GITHUB_ENV"
              echo "  ${var}: set (${#value} chars)"
            else
              echo "  ${var}: empty — skipped"
            fi
          done

      - name: Build Tauri app
        working-directory: desktop/src-tauri
        shell: bash
        run: cargo tauri build ${{ matrix.tauri_args }}

      - name: Collect artefacts
        id: collect
        shell: bash
        run: |
          mkdir -p _release
          cd desktop/src-tauri/target
          # Tauri writes to ${target}/release/bundle/{dmg,nsis,msi,deb,appimage,...}
          if [ -d release/bundle ]; then
            BUNDLE_DIR=release/bundle
          else
            BUNDLE_DIR=${{ matrix.rust_target }}/release/bundle
          fi
          # Match Tauri's actual product bundles, which are always named
          # `{productName}_{version}_{arch}{.lang}.{ext}` (e.g.
          # `OpenAgentd_1.0.6_aarch64.dmg`). Without the prefix anchor
          # the NSIS toolchain's installer-helper stubs
          # (cli-*.exe, gui-*.exe, t*.exe, w*.exe) get vacuumed up too —
          # they live in `bundle/nsis/` and end in `.exe` but are not
          # something we want on the release page.
          find "$BUNDLE_DIR" -type f \( \
            -name 'OpenAgentd_*.dmg' \
            -o -name 'OpenAgentd_*.app.tar.gz' -o -name 'OpenAgentd_*.app.tar.gz.sig' \
            -o -name 'OpenAgentd_*.exe' -o -name 'OpenAgentd_*.exe.sig' \
            -o -name 'OpenAgentd_*.msi' -o -name 'OpenAgentd_*.msi.sig' \
            -o -name 'OpenAgentd_*.AppImage' -o -name 'OpenAgentd_*.AppImage.sig' \
            -o -name 'OpenAgentd_*.deb' \
          \) -print -exec cp {} "$GITHUB_WORKSPACE/_release/" \;

      - uses: actions/upload-artifact@v4
        with:
          name: openagentd-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: _release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [prepare, build]
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: _artifacts

      - name: Flatten artefacts
        run: |
          mkdir -p _release
          find _artifacts -type f -exec cp {} _release/ \;
          ls -la _release

      - name: Generate latest.json (Tauri updater manifest)
        run: |
          python3 scripts/make_updater_manifest.py \
            --version "${{ needs.prepare.outputs.version }}" \
            --channel "${{ github.event.inputs.channel }}" \
            --artefact-dir _release \
            --out _release/latest.json

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" _release/* --clobber
          else
            gh release create "$TAG" _release/* \
              --title "OpenAgentd Desktop ${{ needs.prepare.outputs.version }}" \
              --generate-notes
          fi

      # The Tauri updater (configured in tauri.conf.json) fetches
      # ``releases/download/latest-desktop/latest.json``. That URL must
      # always resolve to the most recent desktop release's manifest, so
      # we maintain a rolling ``latest-desktop`` release that mirrors
      # only ``latest.json``. The artefact URLs *inside* latest.json
      # still point at the immutable ``v{X.Y.Z}-desktop`` release above,
      # so old clients keep working and downloads are cacheable.
      - name: Update rolling latest-desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ROLLING_TAG="latest-desktop"
          # Delete the old rolling release (and its tag) so we can
          # re-create it pointing at the latest manifest. ``gh release
          # delete --cleanup-tag`` is idempotent: it succeeds with a
          # non-zero exit only when the release exists and the delete
          # call itself fails, which is what we want.
          gh release delete "$ROLLING_TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$ROLLING_TAG" _release/latest.json \
            --title "Desktop updater manifest (rolling)" \
            --notes "Auto-generated. Points at OpenAgentd Desktop ${{ needs.prepare.outputs.version }}. Do not download artefacts from this release directly — use the versioned release instead." \
            --prerelease
