name: Release Desktop

# Triggered manually from the Actions tab once a version is tagged.
# Produces signed (where keys are available) installers for:
#   - macOS arm64 (.dmg, .app.tar.gz)
#   - Windows x64 (.exe NSIS installer, .msi)
#   - Linux x64  (.AppImage, .deb)
#
# Outputs are attached to the GitHub Release matching `app/version.txt`.
# The `latest.json` updater manifest is generated last and uploaded to
# the same release; the Tauri updater endpoint
# (configured in tauri.conf.json) points at that file.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'release-desktop' to confirm"
        required: true
      channel:
        description: "Release channel"
        type: choice
        options: [stable, beta, nightly]
        default: stable

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'release-desktop'
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          VERSION=$(cat app/version.txt | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-desktop" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    name: Build (${{ matrix.platform }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            arch: aarch64
            runner: macos-14
            rust_target: aarch64-apple-darwin
            tauri_args: "--target aarch64-apple-darwin"
          - platform: windows
            arch: x86_64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            tauri_args: ""
          - platform: linux
            arch: x86_64
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            tauri_args: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux WebKitGTK + AppImage deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - uses: astral-sh/setup-uv@v5

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: cargo-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('desktop/src-tauri/Cargo.toml') }}

      - name: Build web UI
        run: |
          cd web
          bun install --frozen-lockfile
          bun run build
          mkdir -p ../app/_web_dist
          cp -r dist/* ../app/_web_dist/

      - name: Build Python sidecar bundle
        run: |
          python3 scripts/build_sidecar.py \
            --root . \
            --out desktop/sidecar-bundle \
            --python-version 3.14

      - name: Generate platform icons
        working-directory: desktop/src-tauri
        run: |
          cargo install tauri-cli --version "^2.0" --locked
          cargo tauri icon icons/icon.png

      - name: Import Apple signing certificate
        if: matrix.platform == 'macos' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Build Tauri app
        working-directory: desktop/src-tauri
        env:
          # Apple notarization (set when secrets exist).
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Tauri updater key for signing release artefacts.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build ${{ matrix.tauri_args }}

      - name: Collect artefacts
        id: collect
        shell: bash
        run: |
          mkdir -p _release
          cd desktop/src-tauri/target
          # Tauri writes to ${target}/release/bundle/{dmg,nsis,msi,deb,appimage,...}
          if [ -d release/bundle ]; then
            BUNDLE_DIR=release/bundle
          else
            BUNDLE_DIR=${{ matrix.rust_target }}/release/bundle
          fi
          find "$BUNDLE_DIR" -type f \( \
            -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \
            -o -name '*.exe' -o -name '*.msi' -o -name '*.exe.sig' -o -name '*.msi.sig' \
            -o -name '*.AppImage' -o -name '*.AppImage.sig' -o -name '*.deb' \
          \) -print -exec cp {} "$GITHUB_WORKSPACE/_release/" \;

      - uses: actions/upload-artifact@v4
        with:
          name: openagentd-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: _release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [prepare, build]
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: _artifacts

      - name: Flatten artefacts
        run: |
          mkdir -p _release
          find _artifacts -type f -exec cp {} _release/ \;
          ls -la _release

      - name: Generate latest.json (Tauri updater manifest)
        run: |
          python3 scripts/make_updater_manifest.py \
            --version "${{ needs.prepare.outputs.version }}" \
            --channel "${{ github.event.inputs.channel }}" \
            --artefact-dir _release \
            --out _release/latest.json

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" _release/* --clobber
          else
            gh release create "$TAG" _release/* \
              --title "OpenAgentd Desktop ${{ needs.prepare.outputs.version }}" \
              --generate-notes
          fi
