voice:
  # Browser mic input → local Whisper transcription → inserted into chat input.
  # No audio leaves your machine. faster-whisper ships with every install,
  # so just flip ``enabled`` to ``true`` below — no extras needed.
  #
  # Future sections (e.g. tts:) will live here alongside voice:.
  enabled: false
  model: local:base
  language: auto   # or e.g. "en", "fr"
  max_file_mb: 25
